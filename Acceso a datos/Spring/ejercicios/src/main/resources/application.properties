spring.application.name=ejercicios

# Conexión a que vase de datos
spring.datasource.url=jdbc:mysql://localhost:3306/ejercicios
spring.datasource.username=root
spring.datasource.password=1234
# Para que se vean las cosas
spring.jpa.show-sql=true
# Que hacer con la BBDD cuando se ejecuta
# Create sustituye los datos
# Update append de los datos
spring.jpa.hibernate.ddl-auto=update
# Que se vea bonito
spring.jpa.properties.hibernate.format_sql=true
# Que no arranque servicio web
spring.main.web-application-type=none