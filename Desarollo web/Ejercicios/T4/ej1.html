<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<button id="botoncico">Generar numero</button>

<script>
    let lista = []

    document.getElementById("botoncico").onclick=generarNum

    function generarNum(){
        lista.push(parseInt(Math.random()*100+1))
        console.log(lista[lista.length-1])
    }
</script>
</body>
</html>
