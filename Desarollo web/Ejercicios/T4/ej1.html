<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<button id="botoncico">Generar numero</button>
<ul>

</ul>
<script>

    document.write("<ul id=\"lista\">")

    document.getElementById("botoncico").onclick=()=>{

        var num = parseInt(Math.random()*100+1)
        document.getElementById("lista").innerHTML += `<li>${num}</li>`

    }

    document.write("</ul>")
</script>
</body>
</html>
