<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" onsubmit="return validar();">
        <label for="anagrama1">Anagrama 1: </label>
        <input type="text" id="anagrama1" required>
        <br>
        <label for="anagrama2">Anagrama 2: </label>
        <input type="text" id="anagrama2" required>
        <br>
        <button type="submit">Enviar</button>
    </form>
    <script>
        let input1 = document.getElementById("anagrama1")
        let input2 = document.getElementById("anagrama2")

        function validar(){

            let anagrama1 = input1.value.toLowerCase()
            let anagrama2 = input2.value.toLowerCase()

            if (anagrama1.length==anagrama2.length) {
                let cont = 0
                for (let i = 0; i < anagrama1.length; i++) {
                    if(anagrama1[i] != anagrama2[(anagrama2.length - i)-1]){
                        alert("Anagrama 1 no es un anagrama de anagrama 2")
                        return false;
                    }
                }
                alert("Anagrama 1 es un anagrama de anagrama 2")
                return true
            }
            alert("Anagrama 1 no es un anagrama de anagrama 2")
            return false;

        }
        
    </script>
</body>
</html>
